<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitLab Helper</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="top">
    <span id="avatar" hidden></span>
    <div class="who">
      <strong id="username">GitLab Helper</strong>
      <small id="status">Not synced yet</small>
    </div>
    <button id="refresh" class="icon-btn" title="Refresh (R)" aria-label="Refresh">
      <svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="settings" class="icon-btn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </header>

  <nav id="tabs" class="tabs" role="tablist"></nav>

  <div class="toolbar">
    <input id="filter" type="search" placeholder="Filter… ( / )" autocomplete="off">
    <button id="bulk" class="text-btn" hidden></button>
  </div>

  <div id="banner" class="banner" hidden></div>
  <main id="list" class="list"></main>

  <script src="api.js"></script>
  <script src="panel.js"></script>
</body>
</html>
